# Mirrors the YouTube channel into channel/feed.json every 3 hours.
# Free on a public repo. No API key — public RSS only. See tools/build_feed.py.
name: channel-feed
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_feed.py
      - name: commit if changed
        run: |
          if git diff --quiet -- channel/feed.json; then echo "no change"; exit 0; fi
          git config user.name  "moonology-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add channel/feed.json
          git commit -m "channel feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
