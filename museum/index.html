<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonology Art Gallery Museum</title>
<style>
  :root { --bg:#050505; --gold:#c9a45c; --ink:#f2ede3; --dim:#8c8476; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family: Futura, "Futura PT", "Century Gothic", "Trebuchet MS", sans-serif; color:var(--ink); }
  canvas { display:block; }
  #hud { position:fixed; left:16px; bottom:16px; right:16px; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  #title { letter-spacing:.28em; font-size:12px; color:var(--dim); text-transform:uppercase; }
  #title b { color:#33ff66; font-weight:500; text-shadow:0 0 8px rgba(51,255,102,.5); }
  #help { font-size:12px; color:var(--dim); text-align:right; line-height:1.6; }
  #label { position:fixed; top:16px; right:16px; max-width:min(380px, calc(100vw - 32px)); padding:16px 18px;
    background:rgba(8,8,7,.86); border:1px solid #c9a45c; box-shadow:0 0 0 1px rgba(51,255,102,.25), 0 0 18px rgba(51,255,102,.18);
    font-size:13px; line-height:1.6; color:#cfc7b8; opacity:0; transform:translateY(-6px); transition:.35s; pointer-events:none; }
  #label.show { opacity:1; transform:none; }
  #label .k { color:#33ff66; letter-spacing:.22em; font-size:11px; text-transform:uppercase; }
  #label .watch { display:inline-block; margin-top:10px; padding:8px 14px; border:1px solid #33ff66; color:#33ff66;
    text-decoration:none; letter-spacing:.14em; font-size:12px; text-transform:uppercase; box-shadow:0 0 10px rgba(51,255,102,.3); }
  #label { max-height:min(70vh, 560px); overflow:auto; }
  #label details { margin-top:10px; border-top:1px solid rgba(201,164,92,.35); padding-top:8px; }
  #label summary { cursor:pointer; color:#c9a45c; letter-spacing:.12em; font-size:12px; text-transform:uppercase; }
  #label .story { margin:8px 0 6px; color:#e6e0d4; font-size:13.5px; line-height:1.6; }
  #label .more { font-size:12px; color:#8c8476; }
  #label .more a { color:#33ff66; text-decoration:none; display:block; margin-top:3px; }
  #label .t { color:#f2ede3; font-size:18px; margin:4px 0 6px; }
  #walk { position:fixed; right:16px; bottom:64px; display:none; flex-direction:column; gap:10px; }
  #walk button { width:56px; height:56px; border-radius:50%; border:1px solid #c9a45c; background:rgba(8,8,7,.7);
    color:#33ff66; font-size:20px; box-shadow:0 0 12px rgba(51,255,102,.25); touch-action:none; }
  @media (pointer: coarse) { #walk { display:flex; } #help { display:none; } }
  #title { white-space:nowrap; }
  @media (max-width: 600px) { #title { font-size:10px; letter-spacing:.18em; } #help { display:none; } }
  #act { position:fixed; left:50%; bottom:72px; transform:translateX(-50%); display:none; padding:12px 20px;
    background:rgba(8,8,7,.86); border:1px solid #c9a45c; color:#33ff66; letter-spacing:.14em; font:500 13px Futura, sans-serif;
    text-transform:uppercase; box-shadow:0 0 14px rgba(51,255,102,.3); cursor:pointer; max-width:calc(100vw - 32px); }
  #turn { position:fixed; right:16px; bottom:200px; width:56px; height:56px; border-radius:50%; border:1px solid #c9a45c;
    background:rgba(8,8,7,.7); color:#33ff66; font-size:26px; line-height:1; box-shadow:0 0 12px rgba(51,255,102,.25);
    cursor:pointer; touch-action:none; z-index:5; }
  @media (pointer: fine) { #turn { bottom:56px; } }
  #enter { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(5,5,5,.92); cursor:pointer; text-align:center; padding:16px; }
  #enter h1 { font-weight:500; letter-spacing:.2em; font-size:clamp(17px,3.4vw,32px); margin:0 0 8px; line-height:1.35; max-width:22em; }
  #enter h1 span { color:var(--gold); }
  #enter p { color:var(--dim); letter-spacing:.2em; font-size:12px; text-transform:uppercase; margin:6px 0; }
  #enter .rule { width:120px; height:1px; background:var(--gold); margin:14px 0; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="enter">
  <p>Welcome to</p>
  <h1>THE <span>MOONOLOGY ART GALLERY</span> MUSEUM</h1>
  <div class="rule"></div>
  <p>Room 01 · The Shabti of Amenhotep III</p>
  <p style="margin-top:22px;color:#33ff66;text-shadow:0 0 10px rgba(51,255,102,.6)">Click to enter</p>
</div>
<div id="label"></div>
<button id="act" type="button"></button>
<button id="turn" type="button" aria-label="Turn around" title="Turn around (T)">↻</button>
<div id="walk"><button data-d="1" aria-label="Walk forward">▲</button><button data-d="-1" aria-label="Walk back">▼</button></div>
<div id="hud">
  <div id="title">Moonology Art Gallery · <b>Room 01</b></div>
  <div id="help">Drag to look · W A S D or arrows to walk · E elevator · T turn around</div>
</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// Palette, 60-30-10: black (walls/floor) · warm gold (architecture) · terminal green (accent only)
const GREEN = 0x33ff66;
const neon = new THREE.MeshBasicMaterial({ color: GREEN, toneMapped: false });
const neonLine = new THREE.LineBasicMaterial({ color: GREEN, toneMapped: false });

// ---------- renderer / scene ----------
const QS = new URLSearchParams(location.search);
const TOUR = QS.has('tour'), FPS = 25, TW = 1080, TH = 1920;
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer: TOUR });
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.5 : 2));
if (TOUR) { renderer.setPixelRatio(1); renderer.setSize(TW, TH, false); renderer.domElement.style.cssText = 'height:100vh;width:auto;margin:0 auto'; }
else renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = TOUR ? 1.3 : 1.05;   // phones in daylight: the film runs a little brighter
renderer.shadowMap.enabled = !IS_TOUCH;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020203);
scene.fog = new THREE.Fog(0x020203, 14, 34);

const camera = new THREE.PerspectiveCamera(TOUR ? 58 : 62, TOUR ? TW/TH : innerWidth/innerHeight, 0.05, 200);
camera.position.set(0, 1.62, 0.2);

const tex = new THREE.TextureLoader();
const load = (url) => { const t = tex.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

// ---------- room: 9 wide x 9 deep x 5 high (Deco height), skylight overhead ----------
const W = 9, D = 9, H = 5.0;
const wallMat  = new THREE.MeshStandardMaterial({ color:0x15130f, roughness:0.92 });
// Art Deco floor: black marble squares, cream diamonds, gold inlay lines
function decoFloorTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d'), s = 256;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    g.fillStyle = (x + y) % 2 ? '#0b0a09' : '#100e0c'; g.fillRect(x*s, y*s, s, s);
    g.save(); g.translate(x*s + s/2, y*s + s/2); g.rotate(Math.PI/4);
    g.fillStyle = '#3b352c'; g.fillRect(-16, -16, 32, 32); g.restore();
  }
  g.strokeStyle = '#6e5a35'; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i*s, 0); g.lineTo(i*s, 1024); g.stroke();
                                 g.beginPath(); g.moveTo(0, i*s); g.lineTo(1024, i*s); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(W/4, D/4); t.anisotropy = 8; return t;
}
const floorMat = new THREE.MeshStandardMaterial({ map: decoFloorTexture(), roughness:0.3, metalness:0.1 });
const goldMat  = new THREE.MeshStandardMaterial({ color:0xc9a45c, roughness:0.35, metalness:0.85 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

function wall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m;
}
wall(W, H, 0, H/2, -D/2, 0);            // back wall (the piece)
const DOOR_W = 1.8, DOOR_H = 3.0, HALL_W = 3.0, HALL_L = 14, HALL_H = 3.6;
const R2_DOOR_W = 1.6, R2_DOOR_H = 2.5, R2W = 9, R2D = 11;
// side halls for future rooms: openings in the main hall at BZ, corridors BL long
const BW = 1.8, BH = 2.6, BCW = 2.4, BL = 6, BCH = 3.0;
// entrance wall, built in three pieces around a doorway
wall((W - DOOR_W)/2, H, -(W + DOOR_W)/4, H/2, D/2, Math.PI);
wall((W - DOOR_W)/2, H,  (W + DOOR_W)/4, H/2, D/2, Math.PI);
wall(DOOR_W, H - DOOR_H, 0, DOOR_H + (H - DOOR_H)/2, D/2, Math.PI);
wall(D, H, -W/2, H/2, 0,  Math.PI/2);   // left
wall(D, H,  W/2, H/2, 0, -Math.PI/2);   // right

// ceiling with a square skylight opening
const ceil = new THREE.Group();
const cMat = new THREE.MeshStandardMaterial({ color:0x0d0c0a, roughness:1, side:THREE.DoubleSide });
const hole = 3.2;
[[W, (D-hole)/2, 0, -(D+hole)/4], [W, (D-hole)/2, 0, (D+hole)/4],
 [(W-hole)/2, hole, -(W+hole)/4, 0], [(W-hole)/2, hole, (W+hole)/4, 0]].forEach(([w,d,x,z]) => {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), cMat);
  p.rotation.x = Math.PI/2; p.position.set(x, H, z); ceil.add(p);
});
scene.add(ceil);

// thin gold rail around the room at 3.3 m
const railY = 4.45;
[[W, 0, -D/2+0.01, 0], [W, 0, D/2-0.01, Math.PI], [D, -W/2+0.01, 0, Math.PI/2], [D, W/2-0.01, 0, -Math.PI/2]]
  .forEach(([len, x, z, ry]) => {
    const r = new THREE.Mesh(new THREE.BoxGeometry(len, 0.025, 0.02), goldMat);
    r.position.set(x, railY, z); r.rotation.y = ry; scene.add(r);
  });

// terminal-green cove line at the foot of every wall (accent lighting, 10% of the palette)
for (const [len, x, z, ry] of [[W, 0, -D/2+0.02, 0], [(W-DOOR_W)/2, -(W+DOOR_W)/4, D/2-0.02, Math.PI], [(W-DOOR_W)/2, (W+DOOR_W)/4, D/2-0.02, Math.PI], [D, -W/2+0.02, 0, Math.PI/2], [D, W/2-0.02, 0, -Math.PI/2]]) {
  const cove = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.012), neon);
  cove.position.set(x, 0.06, z); cove.rotation.y = ry; scene.add(cove);
}

// ---------- Art Deco architecture ----------
// fluted gold-edged pilasters along both side walls
const pilMat = new THREE.MeshStandardMaterial({ color:0x1e1b16, roughness:0.6 });
for (const side of [-1, 1]) for (const z of [-3.2, -1.05, 1.05, 3.2]) {
  const p = new THREE.Group();
  p.add(new THREE.Mesh(new THREE.BoxGeometry(0.12, H, 0.46), pilMat));
  for (const off of [-0.15, -0.05, 0.05, 0.15]) {           // gold flutes
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.02, H - 0.6, 0.012), goldMat);
    f.position.set(-0.065, 0, off); p.add(f);
  }
  for (const yy of [H/2 - 0.25, H/2 - 0.12]) {               // stepped capital
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, yy > H/2 - 0.2 ? 0.62 : 0.54), goldMat);
    cap.position.y = yy; p.add(cap);
  }
  p.position.set(side*(W/2 - 0.06), H/2, z); if (side > 0) p.rotation.y = Math.PI;
  scene.add(p);
}

// the piece's size and hang: 20 x 28 in canvas shown at 2.6x; centre at 1.6 m (museum eye-level hang)
const cw = 0.508*2.6, ch = 0.711*2.6, depth = 0.05, artY = 1.6;

// stepped (ziggurat) frame behind the piece: three receding gold-edged panels
const frameGroup = new THREE.Group();
[[0.78, 0x0f0e0c], [0.52, 0x1a1712], [0.28, 0x0b0a09]].forEach(([m, col], i) => {
  const w = cw + m, h = ch + m;
  const panel = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.02), new THREE.MeshStandardMaterial({ color:col, roughness:0.8 }));
  panel.position.z = i * 0.012; frameGroup.add(panel);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, 0.02)),
    new THREE.LineBasicMaterial({ color:0xc9a45c }));
  e.position.z = i * 0.012 + 0.001; frameGroup.add(e);
});
// terminal-green neon outline: a thin glowing line just outside the canvas edge
{
  const gw = cw + 0.1, gh = ch + 0.1, t = 0.012;
  for (const [w, h, x, y] of [[gw, t, 0, gh/2], [gw, t, 0, -gh/2], [t, gh, -gw/2, 0], [t, gh, gw/2, 0]]) {
    const bar = new THREE.Mesh(new THREE.PlaneGeometry(w, h), neon);
    bar.position.set(x, y, 0.04); frameGroup.add(bar);
  }
}
frameGroup.position.set(0, artY, -D/2 + 0.012);
scene.add(frameGroup);

// FIX 3: the Moon as the hub of the sunburst — a small lunar globe in a gold-and-green ring above the piece
const frameTop = artY + (ch + 0.78)/2;
const hubY = frameTop + 0.42;
const lunar = new THREE.Mesh(new THREE.SphereGeometry(0.3, 64, 48),
  new THREE.MeshStandardMaterial({ map: load('assets/moon.jpg'), roughness:1 }));
lunar.position.set(0, hubY, -D/2 + 0.18); scene.add(lunar);
const lunarKey = new THREE.SpotLight(0xfff1dc, 14, 3, Math.PI/10, 0.5, 1.5);
lunarKey.position.set(-0.9, hubY + 0.9, -D/2 + 1.6); lunarKey.target = lunar; scene.add(lunarKey);
const ringGold = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.37, 96), goldMat);
ringGold.position.set(0, hubY, -D/2 + 0.03); scene.add(ringGold);
const ringNeon = new THREE.Mesh(new THREE.RingGeometry(0.385, 0.395, 96), neon);
ringNeon.position.set(0, hubY, -D/2 + 0.031); scene.add(ringNeon);

// sunburst fan radiating from the Moon (upper half)
const fan = new THREE.Group();
const rays = 17;
for (let i = 0; i < rays; i++) {
  const a = Math.PI * (i + 0.5) / rays;
  const len = i % 2 ? 0.42 : 0.62, r0 = 0.44;
  const ray = new THREE.Mesh(new THREE.BoxGeometry(0.022, len, 0.01), goldMat);
  ray.position.set(Math.cos(a) * (r0 + len/2), Math.sin(a) * (r0 + len/2), 0);
  ray.rotation.z = a - Math.PI/2; fan.add(ray);
}
fan.position.set(0, hubY, -D/2 + 0.03);
scene.add(fan);

// stepped skylight coffer: three gold-edged rings around the opening
for (let i = 0; i < 3; i++) {
  const s = hole + 0.5 + i*0.55, y = H - 0.02 - i*0.09;
  const ring = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(s, s)),
    new THREE.LineBasicMaterial({ color:0xc9a45c }));
  ring.rotation.x = Math.PI/2; ring.position.y = y; scene.add(ring);
}

// chevron frieze along the gold rail on the back wall
const chev = new THREE.Group();
for (let x = -W/2 + 0.3; x < W/2 - 0.2; x += 0.3) for (const s of [-1, 1]) {
  if (Math.abs(x) < 1.3) continue;   // leave the sunburst clear
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.014, 0.01), goldMat);
  bar.position.set(x + s*0.065, railY + 0.1, -D/2 + 0.02); bar.rotation.z = s * 0.6; chev.add(bar);
}
scene.add(chev);

// ---------- the Moon, seen through the skylight ----------
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(2.2, 64, 48),
  new THREE.MeshStandardMaterial({ map: load('assets/moon.jpg'), roughness:1, metalness:0 })
);
moon.position.set(0, 16, -3);
scene.add(moon);
// key light for the sky Moon only: a short-reach spot, so it can't glare off the polished floor
const moonKey = new THREE.SpotLight(0xfff4e0, 60, 12, Math.PI/12, 0.3, 1.2);
moonKey.position.set(-5, 20, 2); moonKey.target = moon; scene.add(moonKey);

// stars above the skylight
const starGeo = new THREE.BufferGeometry(); const sp = [];
for (let i = 0; i < 900; i++) {
  const r = 60 + Math.random()*20, th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI*0.42;
  sp.push(r*Math.sin(ph)*Math.cos(th), 8 + r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.18, sizeAttenuation:true, fog:false }));
scene.add(stars);

// cool moonlight pouring down through the skylight
const moonShaft = new THREE.SpotLight(0x9fb4d6, 9, 14, Math.PI/7, 0.9, 1.6);
moonShaft.position.set(0, H + 0.5, 0); moonShaft.target.position.set(0, 0, -0.5);
scene.add(moonShaft, moonShaft.target);
scene.add(new THREE.AmbientLight(0x3a332a, 1.6));
scene.add(new THREE.HemisphereLight(0x8fa3c4, 0x1a140c, 0.6));
// warm wall-wash lights so the side walls and pilasters read
for (const [x, z] of [[-3.3, -2.2], [3.3, -2.2], [-3.3, 2.2], [3.3, 2.2]]) {
  const w = new THREE.PointLight(0xffd59a, 2.5, 7, 1.6); w.position.set(x, 3.6, z); scene.add(w);
}

// ---------- the piece: Amenhotep III shabti canvas, 20 x 28 in (0.508 x 0.711 m) shown at 2x for a museum wall ----------
const art = new THREE.Group();
const canvasFace = new THREE.MeshStandardMaterial({ map: load('assets/shabti.jpg'), roughness:0.85 });
const edge = new THREE.MeshStandardMaterial({ color:0x050505, roughness:0.9 });
const box = new THREE.Mesh(new THREE.BoxGeometry(cw, ch, depth), [edge, edge, edge, edge, canvasFace, edge]);
box.castShadow = true; art.add(box);
art.position.set(0, artY, -D/2 + depth/2 + 0.02);
scene.add(art);

// warm gallery spot on the canvas
const spot = new THREE.SpotLight(0xffe2b0, 60, 9, Math.PI/11, 0.55, 1.6);
spot.position.set(0, H - 0.2, -D/2 + 2.6); spot.target = art;
spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024);
scene.add(spot);

// ---------- plaque (text re-verified 2026-10-12 at the Met collection API, object 544492: isPublicDomain true) ----------
function plaqueTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#0e0d0b'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#c9a45c'; g.fillRect(64, 70, 120, 3);
  const font = (s, w=400) => `${w} ${s}px Futura, "Century Gothic", sans-serif`;
  g.fillStyle = '#c9a45c'; g.font = font(26); g.fillText('R O O M   0 1   ·   N O .  0 1', 64, 54);
  g.fillStyle = '#f2ede3'; g.font = font(48, 500); g.fillText('Shabti of Amenhotep III', 64, 140);
  g.fillStyle = '#b8b0a2'; g.font = font(27);
  [ 'Ebony; eyes inlaid with blue, white, black glass',
    'New Kingdom, Dynasty 18, ca. 1386–1347 BCE',
    'The Metropolitan Museum of Art, Rogers Fund, 1915',
    'Accession 15.2.10  ·  Public domain (Met Open Access)' ].forEach((t, i) => g.fillText(t, 64, 205 + i*48));
  g.fillStyle = '#8c8476'; g.font = font(22);
  g.fillText('Moonology Art Gallery  ·  As above, so below.', 64, 470);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 0.44),
  new THREE.MeshStandardMaterial({ map: plaqueTexture(), roughness:0.6 }));
plaque.position.set(cw/2 + 0.39 + 0.62, 1.45, -D/2 + 0.025);
const plaqueLight = new THREE.SpotLight(0xffe2b0, 8, 4, Math.PI/14, 0.6, 1.5);
plaqueLight.position.set(plaque.position.x, 3.4, -D/2 + 1.6); plaqueLight.target = plaque; scene.add(plaqueLight);
scene.add(plaque);

// a low bench to sit and look
const bench = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.42, 0.5),
  new THREE.MeshStandardMaterial({ color:0x1c1915, roughness:0.7 }));
bench.position.set(0, 0.21, -1.4); bench.castShadow = bench.receiveShadow = true; scene.add(bench);

// ---------- slow drifting dust in the moonlight (the "living" layer) ----------
const N = 260, dg = new THREE.BufferGeometry(), dp = new Float32Array(N*3), seeds = new Float32Array(N);
for (let i = 0; i < N; i++) {
  { const r = Math.sqrt(Math.random())*1.1, a = Math.random()*Math.PI*2;
    dp[i*3] = Math.cos(a)*r; dp[i*3+1] = 0.4 + Math.random()*(H-0.6); dp[i*3+2] = Math.sin(a)*r - 0.2; }
  seeds[i] = Math.random()*100;
}
dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));

    const stem = new THREE.Mesh(new THREE.BoxGeometry(0.012, ph*0.92, 0.012), goldMat);
    stem.position.set(Math.cos(a)*0.17, 0.18 + ph/2, Math.sin(a)*0.17); g.add(stem);

    const band = new THREE.Mesh(new THREE.TorusGeometry(0.155, 0.012, 8, 32), goldMat); band.rotation.x = Math.PI/2; band.position.y = yy; g.add(band);
  }
  const prof = [[0.15, 0], [0.18, 0.12], [0.26, 0.34], [0.33, 0.52], [0.35, 0.6], [0.0, 0.62]].map(([r, y]) => new THREE.Vector2(r, y));

// bonsai in a stepped Deco planter
function bonsai(x, z, sc = 1, seed = 1) {
  const rnd = (() => { let a = seed * 9301 + 49297; return () => ((a = (a * 9301 + 49297) % 233280) / 233280); })();
  const g = new THREE.Group();
  const potMat = ebony;
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.22, 0.42), potMat); p1.position.y = 0.11; g.add(p1);
  const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.05, 0.5), goldMat); p2.position.y = 0.245; g.add(p2);
  const stand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.36), potMat); stand.position.y = -0.25; g.add(stand);
  const soil = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.02, 0.4), new THREE.MeshStandardMaterial({ color:0x2a1f15, roughness:1 })); soil.position.y = 0.27; g.add(soil);
  const bark = new THREE.MeshStandardMaterial({ color:0x4a3626, roughness:0.95 });
  const leaf = new THREE.MeshStandardMaterial({ color:0x2f4f2a, roughness:0.9, flatShading:true });
  const trunk = new THREE.CatmullRomCurve3([V3(0, 0.27, 0), V3(0.08, 0.5, 0.02), V3(-0.06, 0.75, 0), V3(0.05, 0.98, -0.02), V3(-0.02, 1.15, 0)]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(trunk, 24, 0.045, 8), bark));
  const tips = [V3(0.38, 0.86, 0.05), V3(-0.36, 1.0, -0.04), V3(0.12, 1.28, 0.02), V3(-0.2, 0.7, 0.08)];
  const roots = [V3(0.06, 0.6, 0.02), V3(-0.04, 0.85, 0), V3(0.02, 1.05, -0.01), V3(0.0, 0.55, 0.0)];
  tips.forEach((tp, i) => {
    const br = new THREE.CatmullRomCurve3([roots[i], roots[i].clone().lerp(tp, 0.5).add(V3(0, 0.06, 0)), tp]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(br, 12, 0.022, 6), bark));
    for (let k = 0; k < 6; k++) {   // a flat foliage pad, the classic cloud shape
      const pad = new THREE.Mesh(new THREE.IcosahedronGeometry(0.1 + rnd()*0.06, 0), leaf);
      pad.position.set(tp.x + (rnd()-0.5)*0.28, tp.y + (rnd()-0.3)*0.08, tp.z + (rnd()-0.5)*0.22);
      pad.scale.y = 0.55; g.add(pad);
    }
  });
  g.position.set(x, 0.5*sc, z); g.scale.setScalar(sc); scene.add(g);
  obstacles.push({ x, z, r: 0.5*sc });
}

// wayfinding sign: brass frame, black field, gold type, green arrows
function signTexture(rows, w = 1024, h = 384) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const q = c.getContext('2d'); q.fillStyle = '#0b0a08'; q.fillRect(0, 0, w, h);
  q.strokeStyle = '#c9a45c'; q.lineWidth = 6; q.strokeRect(12, 12, w-24, h-24); q.lineWidth = 2; q.strokeRect(26, 26, w-52, h-52);
  const rowH = (h - 70) / rows.length;
  rows.forEach(([arrowL, text, arrowR, small], i) => {
    const y = 35 + rowH*i + rowH/2 + 12;
    q.textAlign = 'center';
    q.fillStyle = small ? '#8c8476' : '#f2ede3'; q.font = `${small ? 400 : 500} ${small ? 30 : 42}px Futura, "Century Gothic", sans-serif`;
    q.fillText(text, w/2, y);
    q.fillStyle = '#33ff66'; q.font = '500 52px Futura, sans-serif';
    if (arrowL) { q.textAlign = 'left'; q.fillText(arrowL, 56, y + 2); }
    if (arrowR) { q.textAlign = 'right'; q.fillText(arrowR, w - 56, y + 2); }
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function wallSign(rows, x, y, z, ry, w = 1.0, h = 0.375) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: signTexture(rows), roughness:0.5, emissive:0x111111 }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m;
}
function hangingSign(frontRows, backRows, x, y, z) {   // hangs from the ceiling on two gold rods, readable both ways
  const front = wallSign(frontRows, x, y, z - 0.01, Math.PI, 1.7, 0.64);
  const back = wallSign(backRows, x, y, z + 0.01, 0, 1.7, 0.64);

    rod.position.set(x + dx, (HALL_H + y + 0.32)/2, z); scene.add(rod);
  }
  return [front, back];
}

                           && (z < hallZ1 - 0.6 || Math.abs(x) < R2_DOOR_W/2 - 0.3);
  const inRoom2 = (x, z) => x > -R2W/2 + 0.5 && x < R2W/2 - 0.5 && z > hallZ1 + 0.5 && z < hallZ1 + R2D - 0.8;
  const inBranch = (x, z) => Math.abs(z - BZ) < BCW/2 - 0.45 && Math.abs(x) > HALL_W/2 - 0.6 && Math.abs(x) < HALL_W/2 + BL - (x > 0 ? -0.3 : 0.6)
                             && (Math.abs(x) > HALL_W/2 + 0.2 || Math.abs(z - BZ) < BW/2 - 0.3);
  const LV = lvlOf();
  const inGallery = (x, z) => (x > GX0 - 0.75 && x < GX0 + 0.3 && Math.abs(z - BZ) < BCW/2 - 0.45)
                           || (x >= GX0 + 0.3 && x < GX1 - 0.4 && Math.abs(z - BZ) < GW/2 - 0.4);
  const inRoom3 = (x, z) => x > R3X0 + 0.5 && x < GX1 - 0.4 && Math.abs(z - BZ) < R3W/2 - 0.5;
  const cabHere = elev.floor === LV && elev.state !== 'moving';
  const lift = (x, z) => (inDoorway(x, z) && cabHere && elev.door > 0.85) || (inCab(x, z) && (cabHere || elev.state === 'moving'));
  const blocked = (x, z) => obstacles.some(o => (o.lvl || 0) !== LV ? false : o.box ? (x > o.box[0] && x < o.box[1] && z > o.box[2] && z < o.box[3])
                                                        : Math.hypot(x - o.x, z - o.z) < o.r);
  const cx = camera.position.x, cz = camera.position.z;
  const okHere = LV === 1 ? (inRoom3(cx, cz) || lift(cx, cz))
                          : (inRoom(cx, cz) || inHall(cx, cz) || inRoom2(cx, cz) || inBranch(cx, cz) || inGallery(cx, cz) || lift(cx, cz));
  if (!okHere || blocked(cx, cz)) {
    camera.position.x = prevX; camera.position.z = prevZ;
  }
  if (turning) {
    turning.t = Math.min(1, turning.t + dt/0.6);
    const e = turning.t*turning.t*(3 - 2*turning.t);
    yaw = turning.from + (turning.to - turning.from)*e; pitch = turning.p0*(1 - e);
    if (turning.t >= 1) { yaw = Math.atan2(Math.sin(yaw), Math.cos(yaw)); turning = null; }
  }
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  } else tourCamera(t);

  moon.rotation.y = t * 0.02;            // the Moon turns slowly overhead
  stars.rotation.y = t * 0.004;
  const p = dg.attributes.position;      // dust drifts down and sways
  for (let i = 0; i < N; i++) {
    let y = p.getY(i) - dt * 0.05; if (y < 0.4) y = H - 0.2;
    p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(t*0.3 + seeds[i]) * 0.0006);
  }
  p.needsUpdate = true;
  spot.intensity = 60 + Math.sin(t * 0.4) * 2;   // a barely-there breathing of the gallery light

  elevUpdate(dt, t);
  mirrorsUpdate(dt, t);
  lunar.rotation.y = t * 0.05;
  for (const tc of torches) {   // flame flicker
    const f = 0.85 + 0.15*Math.sin(t*9 + tc.seed) + 0.08*Math.sin(t*23 + tc.seed*2);
    tc.flame.scale.set(1, f, 1); tc.light.intensity = 4.2 + f*1.6;
  }
  let nearest = null, nd = 2.6;
  for (const ex of exhibits) { const d = camera.position.distanceTo(ex.pos); if (d < nd) { nd = d; nearest = ex; } }
  if (!TOUR) showLabel(pinned || nearest);
  if (!TOUR) {   // the corner title follows the visitor from room to room
    const cp = camera.position;
    const where = cp.y < BASE/2 ? "Room 03 · The Hall of Ma'at" : inCab(cp.x, cp.z) ? 'The Elevator' : cp.x > GX0 - 0.3 && Math.abs(cp.z - BZ) < GW/2 ? 'Cactus & Succulent Gallery' : camera.position.z > R2Z0 ? 'Room 02 · The Moons' : Math.abs(camera.position.x) > HALL_W/2 + 0.3 && camera.position.z > D/2 ? (camera.position.x > 0 ? 'To Room 03' : 'To Room 04') : camera.position.z > D/2 ? 'The Hall' : 'Room 01';
    if (roomTitle.textContent !== where) roomTitle.textContent = where;
  }
  composer.render();
  if (!TOUR) { requestAnimationFrame(step); return; }
  if (QS.has('preview')) { requestAnimationFrame(step); return; }   // hold one moment of the film for checking a shot
  renderer.domElement.toBlob(async blob => {
    try { await fetch(RECV + String(tourFrame).padStart(5, '0'), { method:'POST', body: blob }); }
    catch (e) { document.title = 'TOUR ERROR ' + e; return; }
    tourFrame++;
    document.title = `TOUR ${tourFrame}/${TOUR_FRAMES}`;
    if (tourFrame < TOUR_FRAMES) tourTick.port2.postMessage(0); else document.title = 'TOUR DONE';
  }, 'image/jpeg', 0.93);
}
if (TOUR) {
  if (QS.has('preview')) tourFrame = Math.round(Number(QS.get('preview')) * FPS);
  if (QS.has('start')) tourFrame = Number(QS.get('start'));   // resume a recording that was interrupted
  // record only after every texture has arrived, so no frame shows a blank wall
  THREE.DefaultLoadingManager.onLoad = () => setTimeout(step, 500);
} else step();

// ?elevtest — a scripted ride for checking the elevator headless: call, step in, choose B, ride, arrive
if (QS.has('elevtest')) {
  window.__m = { elev, camera, cab, innerDoors, outerDoors, keys, doAct, mirrors };
  camera.position.set(GX1 - 1.6, 1.62, BZ); yaw = -Math.PI/2;
  setTimeout(() => doAct(), 300);
  setTimeout(() => { camera.position.set(GX1 + 1.0, 1.62, BZ); yaw = Math.PI/2; }, 2600);
  setTimeout(() => doAct(), 3000);
  if (QS.get('elevtest') === 'look') setTimeout(() => { yaw = -Math.PI/2; }, 3100);
}
document.getElementById('enter').addEventListener('click', e => { e.currentTarget.remove(); audio(); });
if (QS.has('skip') || TOUR) document.getElementById('enter').remove();
if (TOUR) for (const id of ['hud', 'walk', 'label', 'turn', 'act']) document.getElementById(id).style.display = 'none';  // for screenshots / direct links
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
